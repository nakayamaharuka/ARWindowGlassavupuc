<!doctype html>
<html>
    <head>
        <script src="https://aframe.io/releases/1.0.4/aframe.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
        <script src="https://raw.githack.com/donmccurdy/aframe-extras/master/dist/aframe-extras.loaders.min.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-detector.js"></script>
        <script src="https://raw.githack.com/AR-js-org/studio-backend/master/src/modules/marker/tools/gesture-handler.js"></script>
    </head>

    <body style="margin: 0; overflow: hidden;">
        <a-scene
            vr-mode-ui="enabled: false;"
            loading-screen="enabled: false;"
            renderer="logarithmicDepthBuffer: true;"
            arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
            id="scene"
            embedded
            gesture-detector
        >
            <a-assets>
                <a-asset-item
                    id="animated-asset"
                    src="assets/asset.glb"
                ></a-asset-item>
                <audio id="broken" src="assets/asset.mp3" preload="auto"></audio>
            </a-assets>

            <a-marker
                id="animated-marker"
                type="pattern"
                preset="custom"
                url="assets/marker.patt"
                raycaster="objects: .clickable"
                emitevents="true"
                cursor="fuse: false; rayOrigin: mouse;"
                id="markerA"
            >
                <a-entity
                    id="bowser-model"
                    scale="0.13246283903012662 0.13246283903012662 0.13246283903012662"
                    animation-mixer="loop: repeat"
                    gltf-model="#animated-asset"
                    class="clickable"
                    gesture-handler
                ></a-entity>
            </a-marker>

            <a-entity camera></a-entity>
        </a-scene>

        <script>
            // マーカー検出イベントを監視し、音声再生を管理
            const marker = document.querySelector("#animated-marker");
            const sound = document.querySelector("#broken");
            let playedOnce = false; // 音声が再生されたかどうかを追跡

            marker.addEventListener("markerFound", () => {
                // 音声がまだ再生されていない場合のみ再生
                if (!playedOnce && sound.paused) {
                    sound.play().catch((error) => {
                        console.log("オートプレイエラー:", error);
                    });
                    playedOnce = true; // 再生されたことを記録
                }
            });

            marker.addEventListener("markerLost", () => {
                sound.pause(); // マーカーが見えなくなったら音声停止
                sound.currentTime = 0; // 音声の再生位置をリセット
            });
        </script>
    </body>
</html>
